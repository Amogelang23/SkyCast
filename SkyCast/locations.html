<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>Saved Locations | SkyCast</title>
    
    <!-- PWA Requirements -->
    <link rel="manifest" href="/public/manifest.json">
    <meta name="theme-color" content="#0f172a">

    <!-- Font Awesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="/src/css/variables.css">
    <link rel="stylesheet" href="/src/css/base.css">
    <link rel="stylesheet" href="/src/css/components.css">
    <link rel="stylesheet" href="/src/css/animations.css">

    <script type="importmap">
        {
            "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
            }
        }
</script>

</head>
<body class="app-layout">
    <div id="weather-bg-layer" aria-hidden="true" data-weather="clear-night"></div>

    <nav class="sidebar glass-panel" aria-label="Main Navigation">
        <div class="brand">
            <i class="fa-solid fa-meteor fa-2x"></i>
            <span>SkyCast</span>
        </div>
        <ul class="nav-links">
            <li><a href="/"><i class="fa-solid fa-house"></i> Dashboard</a></li>
            <li><a href="/locations.html" class="active" aria-current="page"><i class="fa-solid fa-map-location-dot"></i> Locations</a></li>
            <li><a href="/profile.html"><i class="fa-solid fa-user"></i> Profile</a></li>
        </ul>
        <button id="theme-toggle" aria-label="Toggle Dark/Light Mode">
            <i class="fa-solid fa-circle-half-stroke"></i>
        </button>
    </nav>

    <main class="locations-container padding-lg page-enter" id="main-content">
        <header class="page-header stagger-1">
            <h1>Saved Locations</h1>
            <button id="btn-add-city" class="btn-primary glass-panel">
                <i class="fa-solid fa-plus"></i> Add City
            </button>
        </header>

        <div class="locations-grid stagger-2" id="favorites-list">
        </div>
    </main>

    <script type="module">
        import { LocationsController } from '/src/js/components/LocationsController.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            window.locationsApp = new LocationsController();
        });
    </script>
</body>
</html>
